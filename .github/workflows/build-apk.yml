name: Build Extra Time APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - biometrics-fix

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jawali-release.jks"
          test -s "$RUNNER_TEMP/jawali-release.jks"

      - name: Install Node dependencies
        run: npm ci

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/jawali-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          EXPECTED_SHA256="80c80b10beb37685f41087373f08d7647413440892bc6509947a4342c10c5580"

          "$APKSIGNER" verify --verbose "$APK"

          ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/.*certificate SHA-256 digest: //p' |
            head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')

          echo "Checking release certificate fingerprint..."

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: APK signing certificate does not match the original release."
            echo "Expected fingerprint: $EXPECTED_SHA256"
            echo "Actual fingerprint:   $ACTUAL_SHA256"
            exit 1
          fi

          echo "SUCCESS: APK certificate matches the original release."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Extra-Time-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
